# ============================================
# DeepTutor Docker Compose — Pre-built GHCR Image
# ============================================
# Run DeepTutor using the official pre-built image from GitHub Container Registry.
# No local build required — the image is pulled automatically.
#
# Usage:
#   DEEPTUTOR_IMAGE_DIGEST=<64-character-lowercase-sha256-digest> \
#     python scripts/docker_compose.py -f docker-compose.ghcr.yml up -d
#
# Set DEEPTUTOR_IMAGE_DIGEST to the exact reviewed manifest digest before
# starting. The image reference is constructed with Docker's @sha256 syntax;
# mutable tags (including latest and version tags) cannot be substituted.
#
# Prerequisites:
#   1. Seed the durable owner once before the first start; follow the
#      "Production first-run authentication" section in CONTAINERIZATION.md
#      (the interactive /app/scripts/bootstrap-teeechr-owner.py helper).
#   2. Configure providers in data/user/settings/model_catalog.json or the UI
#      3. Use scripts/docker_compose.py so port mappings are rendered from system.json
#   4. Read the API URL note below before starting
#
# Local LLM (LM Studio / Ollama / vLLM):
#   Use "host.docker.internal" instead of "localhost" in provider base_url fields.
#   Configure provider endpoints in data/user/settings/model_catalog.json or the UI.
#
# ============================================
# IMPORTANT: Frontend-to-Backend API URL
# ============================================
# The frontend (Next.js) runs entirely in the user's browser — not in the container.
# This means "localhost" in the browser refers to the USER'S MACHINE, not the Docker host.
#
# LOCAL deployment (Docker on the same machine you browse from):
#   Leave system.next_public_api_base_external blank. The default http://localhost:8001 works
#   because Docker maps port 8001 from the container to your local machine.
#
# REMOTE SERVER deployment (Docker on a server, accessed from another machine):
#   Set system.next_public_api_base_external to your server's public IP or hostname, e.g.:
#     "next_public_api_base_external": "http://203.0.113.10:8001"
#   Without this, the browser will try to reach localhost:8001 on the USER'S laptop
#   (not the server), and all API calls will fail.
# ============================================

services:
  deeptutor:
    image: ghcr.io/hkuds/deeptutor@sha256:${DEEPTUTOR_IMAGE_DIGEST:?Set DEEPTUTOR_IMAGE_DIGEST to a 64-character sha256 digest}
    pull_policy: always
    container_name: deeptutor
    restart: unless-stopped
    ports:
      # Publish through Caddy or another TLS reverse proxy; do not expose
      # backend or frontend service ports directly to the Internet.
      - "127.0.0.1:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}"
      - "127.0.0.1:${DEEPTUTOR_DOCKER_FRONTEND_PORT:-3782}:${DEEPTUTOR_DOCKER_FRONTEND_PORT:-3782}"

    volumes:
      # Persist the complete runtime tree: admin and per-user workspaces,
      # partner workspaces, durable identity/grants/audit, settings, memory,
      # knowledge bases, and logs. A partial mount loses state on recreation.
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - deeptutor-network

networks:
  deeptutor-network:
    driver: bridge
