name: Docker Release

# Triggered when a GitHub Release is published.
# Builds a multi-platform Docker image and pushes it to GitHub Container Registry (GHCR).
#
# Image: ghcr.io/hkuds/deeptutor
# Tags:
#   - Version tag stripped of 'v' prefix (e.g. release v1.2.3 → image tag 1.2.3)
#   - latest (always points to the most recently published release)
#
# Platforms: linux/amd64, linux/arm64

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release source and version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG is not on origin/main." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected = tag[1:] if tag.startswith("v") else tag
          source = Path("deeptutor/__version__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', source, re.MULTILINE)
          if match is None or match.group(1) != expected:
              actual = match.group(1) if match else "missing"
              raise SystemExit(
                  f"Release tag version {expected!r} does not match source {actual!r}."
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={expected}\n")
          PY

      # Required for linux/arm64 cross-compilation on GitHub-hosted ubuntu runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable BuildKit with multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract tags from the release:
      #   type=semver strips the leading 'v' (v1.2.3 → 1.2.3)
      #   type=raw adds a 'latest' tag on every published release
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hkuds/deeptutor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build release-candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: teeechr-release-candidate:${{ steps.version.outputs.version }}
          build-args: |
            TEEECHR_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release-candidate migration and event identity
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            --entrypoint python \
            -e EXPECTED_RELEASE_VERSION="$RELEASE_VERSION" \
            -e PYTHONPATH=/app \
            "teeechr-release-candidate:$RELEASE_VERSION" \
            /app/scripts/verify-teeechr-release-container.py

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TEEECHR_APP_VERSION=${{ steps.version.outputs.version }}
          # Use GitHub Actions cache to speed up repeated builds
          # mode=max caches all intermediate layers (frontend-builder and python-base are expensive)
          cache-from: type=gha
          cache-to: type=gha,mode=max
