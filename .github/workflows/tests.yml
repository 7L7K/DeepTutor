name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "web/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "web/**"
      - ".github/workflows/tests.yml"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.0

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ "$base_sha" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags origin "$base_sha" --depth=1
            changed_python=()
            while IFS= read -r file; do
              [[ -n "$file" ]] && changed_python+=("$file")
            done < <(git diff --name-only "$base_sha" "${{ github.sha }}" -- '*.py')
          else
            changed_python=()
          fi

          files_to_check=()
          for file in "${changed_python[@]}"; do
            if ! git cat-file -e "$base_sha:$file" 2>/dev/null; then
              files_to_check+=("$file")
            elif git show "$base_sha:$file" | ruff format --check - >/dev/null 2>&1; then
              files_to_check+=("$file")
            else
              echo "Skipping legacy-unformatted Python file: $file"
            fi
          done

          if (( ${#files_to_check[@]} == 0 )); then
            echo "No newly formatted Python files; skipping Ruff format check."
          else
            ruff format --check "${files_to_check[@]}"
          fi

  web-tests:
    name: Web Node Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Run frontend node tests
        working-directory: web
        run: npm run test:node

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from deeptutor.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from deeptutor.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from deeptutor.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from deeptutor.services.config.runtime_settings import RuntimeSettingsService; print('✅ RuntimeSettingsService imports OK')"
          python -c "from deeptutor.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from deeptutor.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from deeptutor.logging import configure_logging, bind_log_context, capture_process_logs, ProcessLogEvent; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: import-check
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt', 'requirements/partners.txt', 'requirements/dev.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements/server.txt \
            -r requirements/partners.txt \
            pytest \
            pytest-asyncio \
            pytest-xdist

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Capture Python test environment
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "python_version=$(python --version 2>&1)"
          echo "pip_version=$(python -m pip --version)"
          echo "cpu_count=$(nproc)"
          echo "workspace_disk=$(df -h . | tail -n 1)"
          python - <<'PY'
          from importlib.metadata import version

          for package in ("pytest", "pytest-asyncio", "pytest-xdist"):
              print(f"{package}_version={version(package)}")
          PY

      - name: Run Python tests with timing diagnostics
        run: |
          echo "🧪 Running Python tests on Python ${{ matrix.python-version }}"
          test_start=$SECONDS
          set +e
          pytest -q -n 4 --dist=loadfile --durations=20 tests deeptutor/learning/tests
          test_status=$?
          set -e
          test_duration=$((SECONDS-test_start))
          echo "python_test_duration_seconds=$test_duration"
          {
            echo "### Python test diagnostics (${{ matrix.python-version }})"
            echo "- Full pytest suite: ${test_duration}s"
            echo "- Parallel mode: xdist auto workers with file-level scheduling"
            echo '- Slowest tests: see the `--durations=20` output above'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, web-tests, import-check, python-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint and format | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web node tests | ${{ needs.web-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.import-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python tests (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.python-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.lint.result == 'failure' || needs.web-tests.result == 'failure' || needs.import-check.result == 'failure' || needs.python-tests.result == 'failure'
        run: exit 1
